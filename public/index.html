<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shahnawaz AI</title>
  <!-- Vercel Speed Insights -->
  <script>
    window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/speed-insights/script.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      max-width: 800px;
      width: 100%;
      padding: 40px;
    }
    h1 {
      color: #333;
      margin-bottom: 10px;
      font-size: 2.5rem;
    }
    .subtitle {
      color: #666;
      margin-bottom: 30px;
      font-size: 1.1rem;
    }
    #chat-container {
      height: 400px;
      overflow-y: auto;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      background: #f9f9f9;
    }
    .message {
      margin-bottom: 15px;
      padding: 12px;
      border-radius: 8px;
      line-height: 1.5;
    }
    .user-message {
      background: #667eea;
      color: white;
      margin-left: 20%;
      text-align: right;
    }
    .assistant-message {
      background: white;
      color: #333;
      margin-right: 20%;
      border: 1px solid #e0e0e0;
    }
    .input-container {
      display: flex;
      gap: 10px;
    }
    #user-input {
      flex: 1;
      padding: 12px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 1rem;
    }
    #user-input:focus {
      outline: none;
      border-color: #667eea;
    }
    #send-btn {
      padding: 12px 30px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.3s;
    }
    #send-btn:hover:not(:disabled) {
      background: #5568d3;
    }
    #send-btn:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    .loading {
      color: #666;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Shahnawaz AI 🤖</h1>
    <p class="subtitle">Your brilliant friendly assistant</p>
    <div id="chat-container"></div>
    <div class="input-container">
      <input 
        type="text" 
        id="user-input" 
        placeholder="Ask me anything..."
        autocomplete="off"
      />
      <button id="send-btn">Send</button>
    </div>
  </div>

  <script>
    const chatContainer = document.getElementById('chat-container');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const messages = [];

    function addMessage(role, content) {
      messages.push({ role, content });
      const messageDiv = document.createElement('div');
      messageDiv.className = `message ${role === 'user' ? 'user-message' : 'assistant-message'}`;
      
      // Convert markdown-style formatting to HTML
      const formattedContent = content
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.+?)\*/g, '<em>$1</em>');
      
      messageDiv.innerHTML = formattedContent;
      chatContainer.appendChild(messageDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    async function sendMessage() {
      const userMessage = userInput.value.trim();
      if (!userMessage) return;

      addMessage('user', userMessage);
      userInput.value = '';
      sendBtn.disabled = true;

      const loadingDiv = document.createElement('div');
      loadingDiv.className = 'message assistant-message loading';
      loadingDiv.textContent = 'Thinking...';
      chatContainer.appendChild(loadingDiv);

      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages })
        });

        if (!response.ok) throw new Error('Failed to get response');

        const data = await response.json();
        chatContainer.removeChild(loadingDiv);
        
        if (data.content && data.content[0]) {
          addMessage('assistant', data.content[0].text);
        } else {
          addMessage('assistant', 'Sorry, I could not process that request.');
        }
      } catch (error) {
        chatContainer.removeChild(loadingDiv);
        addMessage('assistant', 'Sorry, there was an error processing your request.');
        console.error('Error:', error);
      } finally {
        sendBtn.disabled = false;
        userInput.focus();
      }
    }

    sendBtn.addEventListener('click', sendMessage);
    userInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    // Welcome message
    addMessage('assistant', 'Hello! I\'m **Shahnawaz AI**, your brilliant friendly assistant. How can I help you today?');
  </script>
</body>
</html>
