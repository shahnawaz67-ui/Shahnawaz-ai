<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shahnawaz AI</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #080c14;
    --surface: #0d1422;
    --surface2: #111927;
    --border: #1e2d45;
    --accent: #00c6ff;
    --accent2: #7b5ea7;
    --accent3: #ff6b6b;
    --text: #e8f0fe;
    --muted: #5a7090;
    --user-bg: #0f2040;
    --ai-bg: #0d1e35;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    font-family: 'DM Mono', monospace;
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  body::before {
    content: '';
    position: fixed;
    top: -40%; left: -20%;
    width: 80%; height: 80%;
    background: radial-gradient(ellipse, rgba(0,198,255,0.04) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }
  header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 18px 28px;
    background: rgba(13,20,34,0.85);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    z-index: 10;
    position: relative;
  }
  .logo-orb {
    width: 42px; height: 42px;
    border-radius: 50%;
    background: conic-gradient(from 0deg, #00c6ff, #7b5ea7, #ff6b6b, #00c6ff);
    display: flex; align-items: center; justify-content: center;
    animation: spin-orb 6s linear infinite;
    position: relative;
    flex-shrink: 0;
  }
  .logo-orb::after {
    content: 'S';
    position: absolute;
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 18px;
    color: #fff;
    width: 34px; height: 34px;
    background: var(--bg);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }
  @keyframes spin-orb { to { transform: rotate(360deg); } }
  .header-text h1 {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 18px;
    background: linear-gradient(90deg, #00c6ff, #a78bfa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .header-text p {
    font-size: 10px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-top: 1px;
  }
  .status-pill {
    margin-left: auto;
    display: flex; align-items: center; gap: 6px;
    background: rgba(0,198,255,0.07);
    border: 1px solid rgba(0,198,255,0.2);
    border-radius: 20px;
    padding: 5px 12px;
    font-size: 11px;
    color: var(--accent);
  }
  .status-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #00c6ff;
    animation: pulse-dot 2s ease-in-out infinite;
  }
  @keyframes pulse-dot {
    0%,100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.7); }
  }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 28px 20px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    position: relative;
    z-index: 1;
    scroll-behavior: smooth;
  }
  #chat::-webkit-scrollbar { width: 4px; }
  #chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  .welcome {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex: 1;
    text-align: center;
    gap: 20px;
    padding: 40px 20px;
    animation: fade-in 0.8s ease forwards;
  }
  .welcome-orb {
    width: 80px; height: 80px;
    border-radius: 50%;
    background: conic-gradient(from 0deg, #00c6ff, #7b5ea7, #ff6b6b, #00c6ff);
    display: flex; align-items: center; justify-content: center;
    animation: spin-orb 6s linear infinite;
    position: relative;
    box-shadow: 0 0 60px rgba(0,198,255,0.2);
  }
  .welcome-orb::after {
    content: 'S';
    position: absolute;
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 32px;
    color: #fff;
    width: 66px; height: 66px;
    background: var(--bg);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }
  .welcome h2 {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 26px;
    background: linear-gradient(90deg, #00c6ff, #a78bfa, #ff6b6b);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .welcome p { font-size: 13px; color: var(--muted); max-width: 340px; line-height: 1.7; }
  .suggestions {
    display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 10px;
  }
  .suggestion-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 8px 16px;
    font-size: 12px;
    color: var(--text);
    cursor: pointer;
    font-family: 'DM Mono', monospace;
    transition: all 0.2s;
  }
  .suggestion-btn:hover { border-color: var(--accent); color: var(--accent); }
  .message {
    display: flex; gap: 12px;
    max-width: 820px; margin: 0 auto; width: 100%;
    animation: slide-up 0.35s cubic-bezier(0.16,1,0.3,1) forwards;
    opacity: 0;
  }
  @keyframes slide-up {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .message.user { flex-direction: row-reverse; }
  .avatar {
    width: 34px; height: 34px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 600;
    font-family: 'Syne', sans-serif;
    margin-top: 2px;
  }
  .avatar.ai {
    background: conic-gradient(from 0deg, #00c6ff, #7b5ea7, #ff6b6b, #00c6ff);
    position: relative;
    animation: spin-orb 6s linear infinite;
  }
  .avatar.ai::after {
    content: 'S';
    position: absolute;
    width: 28px; height: 28px;
    background: var(--ai-bg);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; color: #fff;
  }
  .avatar.user {
    background: linear-gradient(135deg, #1e3a5f, #2d5a8a);
    border: 1px solid rgba(0,198,255,0.25);
    color: var(--accent);
    font-size: 12px;
  }
  .bubble {
    padding: 14px 18px;
    border-radius: 18px;
    font-size: 13.5px;
    line-height: 1.75;
    max-width: calc(100% - 50px);
  }
  .message.ai .bubble {
    background: var(--ai-bg);
    border: 1px solid var(--border);
    border-top-left-radius: 6px;
  }
  .message.user .bubble {
    background: var(--user-bg);
    border: 1px solid rgba(0,198,255,0.15);
    border-top-right-radius: 6px;
  }
  .typing-bubble {
    background: var(--ai-bg);
    border: 1px solid var(--border);
    padding: 14px 20px;
    border-radius: 18px;
    border-top-left-radius: 6px;
    display: flex; align-items: center; gap: 5px;
  }
  .typing-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--accent);
    animation: typing-bounce 1.2s ease-in-out infinite;
    opacity: 0.6;
  }
  .typing-dot:nth-child(2) { animation-delay: 0.2s; background: #a78bfa; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; background: var(--accent3); }
  @keyframes typing-bounce {
    0%,80%,100% { transform: translateY(0); opacity: 0.5; }
    40% { transform: translateY(-6px); opacity: 1; }
  }
  .input-wrapper {
    padding: 16px 20px 20px;
    background: rgba(13,20,34,0.9);
    backdrop-filter: blur(20px);
    border-top: 1px solid var(--border);
    z-index: 10;
    position: relative;
  }
  .input-row {
    max-width: 820px; margin: 0 auto;
    display: flex; gap: 10px; align-items: flex-end;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 10px 14px;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .input-row:focus-within {
    border-color: rgba(0,198,255,0.35);
    box-shadow: 0 0 0 3px rgba(0,198,255,0.06);
  }
  #user-input {
    flex: 1; background: none; border: none; outline: none;
    font-family: 'DM Mono', monospace;
    font-size: 13.5px; color: var(--text);
    resize: none; max-height: 140px; overflow-y: auto; line-height: 1.6;
  }
  #user-input::placeholder { color: var(--muted); }
  #send-btn {
    width: 36px; height: 36px;
    border-radius: 10px;
    background: linear-gradient(135deg, #00c6ff, #7b5ea7);
    border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: opacity 0.2s, transform 0.15s;
    align-self: flex-end;
  }
  #send-btn:hover { opacity: 0.85; transform: scale(1.04); }
  #send-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  #send-btn svg { width: 16px; height: 16px; fill: #fff; }
  .input-footer {
    max-width: 820px; margin: 8px auto 0;
    text-align: center; font-size: 10px; color: var(--muted); letter-spacing: 0.5px;
  }
  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
</style>
</head>
<body>
<header>
  <div class="logo-orb"></div>
  <div class="header-text">
    <h1>Shahnawaz AI</h1>
    <p>Intelligent Assistant</p>
  </div>
  <div class="status-pill">
    <div class="status-dot"></div>
    Online
  </div>
</header>
<div id="chat">
  <div class="welcome" id="welcome">
    <div class="welcome-orb"></div>
    <h2>Hello, I'm Shahnawaz AI</h2>
    <p>Your intelligent AI companion. Ask me anything — from creative writing to coding, analysis, or just a conversation.</p>
    <div class="suggestions">
      <button class="suggestion-btn" onclick="quickSend(this)">✦ What can you do?</button>
      <button class="suggestion-btn" onclick="quickSend(this)">✦ Write a poem for me</button>
      <button class="suggestion-btn" onclick="quickSend(this)">✦ Explain quantum physics</button>
      <button class="suggestion-btn" onclick="quickSend(this)">✦ Help me write code</button>
    </div>
  </div>
</div>
<div class="input-wrapper">
  <div class="input-row">
    <textarea id="user-input" placeholder="Message Shahnawaz AI..." rows="1"></textarea>
    <button id="send-btn" onclick="sendMessage()" title="Send">
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>
  <div class="input-footer">Shahnawaz AI · Powered by Claude</div>
</div>
<script>
const chatEl = document.getElementById('chat');
const inputEl = document.getElementById('user-input');
const sendBtn = document.getElementById('send-btn');
let conversationHistory = [];
let isTyping = false;

inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + 'px';
});
inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

function quickSend(btn) {
  inputEl.value = btn.textContent.replace('✦ ', '').trim();
  sendMessage();
}

function addMessage(role, content) {
  const welcome = document.getElementById('welcome');
  if (welcome) welcome.remove();
  const msg = document.createElement('div');
  msg.className = `message ${role}`;
  const avatar = document.createElement('div');
  avatar.className = `avatar ${role}`;
  if (role === 'user') avatar.textContent = 'U';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = formatText(content);
  msg.appendChild(avatar);
  msg.appendChild(bubble);
  chatEl.appendChild(msg);
  chatEl.scrollTop = chatEl.scrollHeight;
}

function formatText(text) {
  return text
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.*?)\*/g, '<em>$1</em>')
    .replace(/`(.*?)`/g, '<code style="background:rgba(0,198,255,0.08);padding:2px 6px;border-radius:4px;font-size:12px;color:#00c6ff;">$1</code>')
    .replace(/\n/g, '<br>');
}

function showTyping() {
  const msg = document.createElement('div');
  msg.className = 'message ai';
  msg.id = 'typing-indicator';
  const avatar = document.createElement('div');
  avatar.className = 'avatar ai';
  const bubble = document.createElement('div');
  bubble.className = 'typing-bubble';
  bubble.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';
  msg.appendChild(avatar);
  msg.appendChild(bubble);
  chatEl.appendChild(msg);
  chatEl.scrollTop = chatEl.scrollHeight;
}

function hideTyping() {
  const t = document.getElementById('typing-indicator');
  if (t) t.remove();
}

async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text || isTyping) return;
  isTyping = true;
  sendBtn.disabled = true;
  inputEl.value = '';
  inputEl.style.height = 'auto';
  addMessage('user', text);
  conversationHistory.push({ role: 'user', content: text });
  showTyping();
  try {
    const response = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: conversationHistory })
    });
    const data = await response.json();
    hideTyping();
    const aiText = data.content?.[0]?.text || 'Sorry, I could not process that.';
    conversationHistory.push({ role: 'assistant', content: aiText });
    addMessage('ai', aiText);
  } catch (err) {
    hideTyping();
    addMessage('ai', '⚠️ Something went wrong. Please try again.');
  }
  isTyping = false;
  sendBtn.disabled = false;
  inputEl.focus();
}
</script>
</body>
</html>
